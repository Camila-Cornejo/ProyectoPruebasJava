name: Pruebas Automatizadas Java

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: calculadora/pom.xml

      - name: Ejecutar pruebas JUnit
        working-directory: calculadora
        run: mvn -B clean test

      - name: Generar reporte HTML
        if: always()
        working-directory: calculadora
        run: mvn -B surefire-report:report-only

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            calculadora/target/reports/
            calculadora/target/surefire-reports/
	    calculadora/target/cucumber-report.html
          if-no-files-found: warn
